site_name: SwiftPack Docs
site_url: https://swiftware-lab.github.io/switpack/
repo_url: https://github.com/SwiftWare-Lab/swiftpack
repo_name: swiftware-lab/swiftpack
docs_dir: doc

theme:
  name: material
  palette:
    # Scheme controls light vs dark mode ("default" = light mode)
    scheme: default
    # Primary controls the header and main UI color
    primary: indigo
    # Accent controls links, buttons, and highlights
    accent: blue

nav:
  - Home: index.md
  - Getting Started:
      - Usage demo: getting-started/usage.md
  - Compiler Pipeline:
      - Overview: compiler/overview.md
      - Code Representation: compiler/basics.md
      - Local Analysis: compiler/local_analysis.md
      - Loop Transformations: compiler/loop_transformations.md
      - Extending the Compiler: compiler/extending.md
  - Benchmark:
      - Matrix multiplication: benchmarks/matmul.md
      - Cholesky decomposition: benchmarks/cholesky.md


